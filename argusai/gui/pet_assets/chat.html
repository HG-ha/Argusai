[hidden]{display:none!important}#new{height:34px;width:24px}#session-picker{flex:1;min-width:0}#session{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid #ffffff12;border-radius:9px;background:#22252b;text-align:left;font-size:12px}#session-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chevron{color:#808591}#session-menu{margin-top:5px;padding:4px;background:#22252b;border:1px solid #ffffff14;border-radius:10px;max-height:116px;overflow:auto}.session-option{display:block;width:100%;border-radius:6px;text-align:left;padding:8px 9px;font-size:12px;color:#b8bdc9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.session-option[aria-selected=true]{color:#f0f2f6;background:#ffffff0b}.session-option:hover,.session-option:focus-visible{background:#ffffff13;outline:none}.preferences{display:flex;align-items:center;justify-content:space-between;margin:8px 0 0}#recover{font-size:11px;color:#a1a6b2;padding:3px 4px}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:5px}body.menu-view{padding:6px;border-radius:12px}#pet-menu button{display:flex;align-items:center;text-align:left;width:100%;height:36px;padding:0 11px;border-radius:7px;font-size:12px;color:#d6dae3}#pet-menu button:hover{background:#ffffff0c}#menu-snap[aria-checked=true]::after{content:'✓';margin-left:auto;color:#9dbff0}#menu-hide{color:#a6abb6!important;border-top:1px solid #ffffff0b;border-radius:0!important;margin-top:4px}#input{padding-left:5px}#tasks-toggle{width:28px!important}
body.toolbar-view{padding:5px;min-height:44px;border-radius:12px}#pet-actions{display:flex;align-items:center;justify-content:center;gap:6px;height:32px}#pet-actions button{display:grid;place-items:center;width:34px;height:32px;border-radius:8px;color:#c8ceda}#pet-actions button:hover{background:#ffffff14;color:white}#pet-actions button:focus-visible{outline:1px solid #91b9fa}#pet-actions svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style><script src="bridge.js"></script></head><body><nav id="pet-actions" aria-label="桌宠操作" hidden><button id="action-chat" title="聊天" aria-label="聊天"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H4l1.6-4A8 8 0 1 1 20 11Z"/></svg></button><button id="action-workbench" title="打开工作台" aria-label="打开工作台"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button><button id="action-more" title="更多" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></nav><section id="pet-menu" hidden><button id="menu-chat">聊天</button><button id="menu-workbench">打开工作台</button><button id="menu-snap" role="menuitemcheckbox" aria-checked="false">贴边吸附</button><button id="menu-recover">桌宠归位</button><button id="menu-hide">隐藏桌宠</button></section><div id="chat-shell" hidden><section id="context" hidden><header><strong id="title">ArgusAI</strong><button id="workbench" title="打开工作台">↗</button></header><div id="tasks" aria-label="当前任务"></div><div class="toolbar"><div id="session-picker"><button id="session" aria-label="选择对话" aria-haspopup="listbox" aria-expanded="false"><span id="session-name">新对话</span><span class="chevron">⌄</span></button><div id="session-menu" role="listbox" aria-label="对话列表" hidden></div></div><button id="new">＋</button></div><div class="preferences"><label class="hint"><input type="checkbox" id="snap"> 贴边吸附</label><button id="recover">桌宠归位</button></div></section><main id="messages" aria-live="polite"></main><button id="approval" hidden>需要确认 · 打开工作台 ↗</button><div id="status" role="status"></div><form><button type="button" id="tasks-toggle" title="任务与会话" aria-label="任务与会话">⋯</button><textarea rows="1" id="input" placeholder="交给 ArgusAI…" aria-label="消息" maxlength="20000"></textarea><button id="send" title="发送" aria-label="发送">↑</button><button type="button" id="close" title="收起" aria-label="收起">×</button></form></div><script src="chat.js"></script></body></html>
